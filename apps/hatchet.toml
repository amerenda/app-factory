[app]
name = "hatchet"
domain = "hatchet.amer.dev"
namespace = "hatchet"

[[components]]
name = "server"
image = "ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest"
port = 8888
replicas = 1
health_path = "/api/ready"
ingress = true

[components.resources.requests]
cpu = "200m"
memory = "512Mi"

[components.resources.limits]
cpu = "1000m"
memory = "1Gi"

# Encryption keysets (pre-created in BWS via hatchet-admin Tink keyset generator)
[[components.env]]
name = "SERVER_ENCRYPTION_MASTER_KEYSET"
secret_ref = { name = "hatchet-encryption-secrets", key = "master-keyset" }

[[components.env]]
name = "SERVER_ENCRYPTION_JWT_PUBLIC_KEYSET"
secret_ref = { name = "hatchet-encryption-secrets", key = "jwt-public-keyset" }

[[components.env]]
name = "SERVER_ENCRYPTION_JWT_PRIVATE_KEYSET"
secret_ref = { name = "hatchet-encryption-secrets", key = "jwt-private-keyset" }

[[components.env]]
name = "SERVER_AUTH_COOKIE_SECRETS"
secret_ref = { name = "hatchet-auth-secrets", key = "cookie-secrets" }

# Database credentials (auto-generated by Tofu)
[[components.env]]
name = "DB_PASSWORD"
secret_ref = { name = "postgres-credentials", key = "password" }

[[components.env]]
name = "DATABASE_URL"
value = "postgresql://hatchet:$(DB_PASSWORD)@10.100.20.18:5432/hatchet"

# Encryption keysets in BWS (pre-created manually; generate=false)
[[secrets]]
bws_name = "hatchet-master-keyset"
k8s_secret = "hatchet-encryption-secrets"
k8s_key = "master-keyset"
generate = false

[[secrets]]
bws_name = "hatchet-jwt-public-keyset"
k8s_secret = "hatchet-encryption-secrets"
k8s_key = "jwt-public-keyset"
generate = false

[[secrets]]
bws_name = "hatchet-jwt-private-keyset"
k8s_secret = "hatchet-encryption-secrets"
k8s_key = "jwt-private-keyset"
generate = false

[[secrets]]
bws_name = "hatchet-cookie-secrets"
k8s_secret = "hatchet-auth-secrets"
k8s_key = "cookie-secrets"
generate = false

# Database password (auto-generated by Tofu)
[[secrets]]
bws_name = "hatchet-postgres-password"
k8s_secret = "postgres-credentials"
k8s_key = "password"
generate = true

[database]
type = "postgres"
name = "hatchet"
host = "10.100.20.18"
extensions = []
password_secret = "hatchet-postgres-password"

[uat]
enabled = false
