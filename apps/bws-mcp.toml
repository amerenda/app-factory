[app]
name = "bws-mcp"
domain = "bws-mcp.amer.dev"
namespace = "bws-mcp"

[[components]]
name = "server"
image = "amerenda/bws-mcp:latest"
port = 8000
replicas = 1
health_path = "/health"
ingress = false

[components.resources.requests]
cpu = "50m"
memory = "64Mi"

[components.resources.limits]
cpu = "200m"
memory = "128Mi"

[[components.env]]
name = "BWS_ACCESS_TOKEN"
secret_ref = { name = "bws-mcp-token", key = "token" }

[[secrets]]
bws_name = "infra-mcp-bws-token"
k8s_secret = "bws-mcp-token"
k8s_key = "token"
generate = false
shared = true

[uat]
enabled = false

[cicd]
repo = "amerenda/dean-mcp"
label = "deploy:bws-mcp"
