[app]
name = "mem0"
domain = "mem0.amer.dev"
namespace = "mem0"

[[components]]
name = "server"
image = "amerenda/mem0-server:latest"
port = 8000
replicas = 1
health_path = "/api/health"
ingress = true

[components.resources.requests]
cpu = "100m"
memory = "256Mi"

[components.resources.limits]
cpu = "500m"
memory = "512Mi"

# Auth
[[components.env]]
name = "ADMIN_API_KEY"
secret_ref = { name = "mem0-auth-secrets", key = "admin-api-key" }

[[components.env]]
name = "JWT_SECRET"
secret_ref = { name = "mem0-auth-secrets", key = "jwt-secret" }

# Database password
[[components.env]]
name = "POSTGRES_PASSWORD"
secret_ref = { name = "mem0-postgres-credentials", key = "password" }

# LiteLLM master key used as OpenAI API key (routes all LLM+embedder calls through LiteLLM)
[[components.env]]
name = "OPENAI_API_KEY"
secret_ref = { name = "mem0-litellm-credentials", key = "master-key" }

# Auth secrets (admin key clients send + JWT signing key)
[[secrets]]
bws_name = "mem0-admin-api-key"
k8s_secret = "mem0-auth-secrets"
k8s_key = "admin-api-key"
generate = true

[[secrets]]
bws_name = "mem0-jwt-secret"
k8s_secret = "mem0-auth-secrets"
k8s_key = "jwt-secret"
generate = true

# Database password (auto-generated by Tofu)
[[secrets]]
bws_name = "mem0-postgres-password"
k8s_secret = "mem0-postgres-credentials"
k8s_key = "password"
generate = true

# LiteLLM master key (already in BWS from Phase 1, shared across apps)
[[secrets]]
bws_name = "litellm-master-key"
k8s_secret = "mem0-litellm-credentials"
k8s_key = "master-key"
generate = false
shared = true

[database]
type = "postgres"
name = "mem0"
host = "10.100.20.18"
extensions = ["vector"]
password_secret = "mem0-postgres-password"

[uat]
enabled = false
