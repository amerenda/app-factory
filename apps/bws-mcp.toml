[app]
name = "bws-mcp"
domain = "bws-mcp.amer.dev"
namespace = "bws-mcp"

# Three deployments — one per permission tier.
# All use the same underlying BWS token (infra-mcp-bws-token).
# Permission enforcement is in the MCP server code via BWS_TIER env var.

[[components]]
name = "admin"
image = "amerenda/bws-mcp:latest"
port = 8000
replicas = 1
health_path = "/health"
ingress = false

[components.resources.requests]
cpu = "50m"
memory = "64Mi"

[components.resources.limits]
cpu = "200m"
memory = "128Mi"

[[components.env]]
name = "BWS_TIER"
value = "admin"

[[components.env]]
name = "BWS_ACCESS_TOKEN"
secret_ref = { name = "bws-mcp-token", key = "token" }

[[components]]
name = "write"
image = "amerenda/bws-mcp:latest"
port = 8001
replicas = 1
health_path = "/health"
ingress = false

[components.resources.requests]
cpu = "50m"
memory = "64Mi"

[components.resources.limits]
cpu = "200m"
memory = "128Mi"

[[components.env]]
name = "BWS_TIER"
value = "write"

[[components.env]]
name = "BWS_ACCESS_TOKEN"
secret_ref = { name = "bws-mcp-token", key = "token" }

[[components]]
name = "read"
image = "amerenda/bws-mcp:latest"
port = 8002
replicas = 1
health_path = "/health"
ingress = false

[components.resources.requests]
cpu = "50m"
memory = "64Mi"

[components.resources.limits]
cpu = "200m"
memory = "128Mi"

[[components.env]]
name = "BWS_TIER"
value = "read"

[[components.env]]
name = "BWS_ACCESS_TOKEN"
secret_ref = { name = "bws-mcp-token", key = "token" }

[[secrets]]
bws_name = "infra-mcp-bws-token"
k8s_secret = "bws-mcp-token"
k8s_key = "token"
generate = false
shared = true

[uat]
enabled = false

[cicd]
repo = "amerenda/bws-mcp"
label = "deploy:bws-mcp"
